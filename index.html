<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#292631">
  <title>A Letter Between the Stars</title>
  <meta name="description" content="Someone left a little letter for you.">
  <meta property="og:title" content="A Letter Between the Stars">
  <meta property="og:description" content="Someone left a little letter for you.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23292631'/%3E%3Cpath d='M32 10L38 26L54 32L38 38L32 54L26 38L10 32L26 26Z' fill='%23E9CBC3'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="is-loading" data-theme="dusk">

  <!-- Ikon & ornamen (SVG sprite) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-sprig" viewBox="0 0 64 64">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 60C31 44 33 28 32 8"/>
        <path d="M32 46c-9 1-15-4-17-12 9-1 16 3 17 12z"/>
        <path d="M32 36c9 1 15-4 17-12-9-1-16 3-17 12z"/>
        <path d="M32 26c-7 0-12-4-13-10 7 0 12 3 13 10z"/>
        <circle cx="32" cy="6" r="2.4"/>
      </g>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z" fill="currentColor"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <!-- Lapisan latar (crossfade antar tema) -->
  <div class="bg bg-dusk" aria-hidden="true"></div>
  <div class="bg bg-paper" aria-hidden="true"></div>
  <div class="bg bg-night" aria-hidden="true"></div>
  <div class="bg bg-final" aria-hidden="true"></div>

  <!-- Canvas bintang + partikel (satu canvas untuk seluruh situs) -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- Loading -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__star" aria-hidden="true"></div>
    <p class="loader__text">preparing a letter…</p>
  </div>

  <!-- Pengumuman perpindahan chapter untuk pembaca layar -->
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;padding:2rem;text-align:center;color:#F8F0EB;background:#292631;z-index:99;font-family:Georgia,serif">
      This little letter needs JavaScript to be opened.
    </p>
  </noscript>

  <!-- Bilah atas: kembali · navigasi chapter · musik -->
  <header class="topbar" id="topbar">
    <h1 class="sr-only" id="siteH1">A Letter Between the Stars</h1>
    <button class="iconbtn" id="btnBack" type="button" aria-label="Previous chapter" disabled>
      <svg class="ico"><use href="#i-back"/></svg>
    </button>

    <button class="navbtn" id="btnMenu" type="button" aria-expanded="false" aria-controls="menu" aria-label="Chapters">
      <span class="navbtn__label"><span id="navNum">01</span><span class="navbtn__sep">·</span><span id="navTitle">The Beginning</span></span>
      <span class="dots" id="dots" aria-hidden="true"></span>
    </button>

    <button class="iconbtn" id="btnMusic" type="button" aria-pressed="false" aria-label="Background music">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </header>

  <nav class="menu" id="menu" aria-label="Chapters">
    <ol class="menu__list" id="menuList"></ol>
  </nav>

  <main id="stage">

    <!-- ============ CHAPTER 01 — THE BEGINNING ============ -->
    <section class="chapter" id="ch1" data-key="begin" tabindex="-1" aria-labelledby="headline">
      <div class="wrap wrap--center">
        <div class="moon rise" style="--d:0" aria-hidden="true"></div>
        <p class="eyebrow rise" style="--d:250" id="siteName" data-t="siteTitle"></p>
        <h2 class="headline" id="headline" data-t="chapter1.headline"></h2>
        <p class="subhead rise" style="--d:2000" data-t="chapter1.subheadline"></p>
        <div class="actions rise" style="--d:2900">
          <button class="btn btn--primary" id="btnBegin" type="button">
            <span data-t="chapter1.button"></span>
            <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
          </button>
        </div>
        <p class="forline rise" style="--d:3500" id="forLine" data-t="chapter1.forLine"></p>
      </div>
    </section>

    <!-- ============ CHAPTER 02 — LITTLE THINGS ============ -->
    <section class="chapter" id="ch2" data-key="things" tabindex="-1" aria-labelledby="t2">
      <div class="wrap">
        <header class="ch-head">
          <p class="eyebrow rise" style="--d:0" data-t="chapter2.label"></p>
          <h2 class="ch-title rise" style="--d:120" id="t2" data-t="chapter2.title"></h2>
          <div class="orn rise" style="--d:240" aria-hidden="true"><span></span><svg class="ico"><use href="#i-sprig"/></svg><span></span></div>
          <p class="ch-intro rise" style="--d:360" data-t="chapter2.intro"></p>
        </header>
        <div class="cards rise" style="--d:500" id="cards"></div>
        <p class="caption rise" style="--d:600" id="cardsCaption" aria-live="polite"></p>
        <div class="actions rise" style="--d:700">
          <button class="btn btn--primary js-next" id="next2" type="button">
            <span data-t="chapter2.next"></span>
            <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ CHAPTER 03 — UNSPOKEN WORDS ============ -->
    <section class="chapter" id="ch3" data-key="words" tabindex="-1" aria-labelledby="t3">
      <div class="wrap">
        <header class="ch-head">
          <p class="eyebrow rise" style="--d:0" data-t="chapter3.label"></p>
          <h2 class="ch-title rise" style="--d:120" id="t3" data-t="chapter3.title"></h2>
        </header>
        <article class="letter rise" style="--d:300" id="letter">
          <p class="letter__date" id="letterDate"></p>
          <p class="letter__greet" id="letterGreet"></p>
          <div class="letter__body" id="letterBody"></div>
          <p class="letter__closing" id="letterClosing"></p>
          <p class="letter__sign" id="letterSign"></p>
          <svg class="ico letter__sprig" aria-hidden="true"><use href="#i-sprig"/></svg>
        </article>
        <p class="letter__note" id="letterNote"></p>
        <div class="actions">
          <button class="btn btn--primary js-next" id="next3" type="button">
            <span data-t="chapter3.next"></span>
            <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ CHAPTER 04 — A UNIVERSE FOR YOU ============ -->
    <section class="chapter chapter--sky" id="ch4" data-key="sky" tabindex="-1" aria-labelledby="t4">
      <div class="sky-top">
        <p class="eyebrow rise" style="--d:0" data-t="chapter4.label"></p>
        <h2 class="ch-title rise" style="--d:120" id="t4" data-t="chapter4.title"></h2>
        <p class="ch-intro rise" style="--d:260" data-t="chapter4.intro"></p>
        <p class="counter rise" style="--d:400" id="starCounter"><span id="starCount">0</span> / <span id="starTotal">0</span> <span data-t="chapter4.foundLabel"></span></p>
      </div>
      <div class="sky-bottom">
        <button class="btn btn--ghost sr-focus" id="starNext" type="button"></button>
        <div class="wish rise" style="--d:600" id="wishPanel" role="status" aria-live="polite">
          <p class="wish__text" id="wishText"></p>
        </div>
        <button class="btn btn--primary js-next rise" style="--d:800" id="next4" type="button">
          <span data-t="chapter4.next"></span>
          <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
        </button>
      </div>
    </section>

    <!-- ============ SISIPAN — MAKE A WISH ============ -->
    <section class="chapter chapter--wish" id="chWish" data-key="wish" data-interlude tabindex="-1" aria-labelledby="tWish">
      <div class="wrap wrap--center">
        <header class="ch-head">
          <p class="eyebrow rise" style="--d:0" data-t="chapterWish.label"></p>
          <h2 class="ch-title rise" style="--d:120" id="tWish" data-t="chapterWish.title"></h2>
          <div class="orn rise" style="--d:240" aria-hidden="true"><span></span><svg class="ico"><use href="#i-star"/></svg><span></span></div>
        </header>

        <div class="wish-stage rise" style="--d:400">
          <form class="wishcard" id="wishForm" novalidate autocomplete="off">
            <label class="wishcard__prompt" for="wishInput" data-t="chapterWish.prompt"></label>
            <textarea class="wishcard__input" id="wishInput" name="wish" rows="4" maxlength="240"
                      data-t-attr="placeholder:chapterWish.placeholder" aria-describedby="wishCount wishError"
                      enterkeyhint="done" spellcheck="true"></textarea>
            <div class="wishcard__meta">
              <p class="wishcard__error" id="wishError" role="alert"></p>
              <p class="wishcard__count" id="wishCount">0 / 240</p>
            </div>
            <div class="actions">
              <button class="btn btn--primary" id="btnSendWish" type="submit">
                <span data-t="chapterWish.button"></span>
                <svg class="ico ico--sm"><use href="#i-star"/></svg>
              </button>
            </div>
          </form>

          <div class="wishdone" id="wishDone" hidden>
            <p class="wishdone__text" id="wishConfirm" tabindex="-1" role="status"></p>
            <p class="wishdone__note" id="wishNote"></p>
            <div class="actions actions--row">
              <button class="btn btn--ghost" id="btnWishMore" type="button"><span data-t="chapterWish.another"></span></button>
              <button class="btn btn--primary js-next" id="nextWish" type="button">
                <span data-t="chapterWish.next"></span>
                <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
              </button>
            </div>
          </div>
        </div>

        <button class="textbtn js-next rise" style="--d:700" id="btnWishSkip" type="button" data-t="chapterWish.skip"></button>
      </div>
    </section>

    <!-- ============ SISIPAN — CONSTELLATION OF WISHES ============ -->
    <section class="chapter chapter--const" id="chConst" data-key="constellation" data-interlude tabindex="-1" aria-labelledby="tConst">
      <div class="const-wrap" id="constMain">
        <div class="sky-top">
          <p class="eyebrow rise" style="--d:0" data-t="chapterConst.label"></p>
          <h2 class="ch-title rise" style="--d:120" id="tConst" data-t="chapterConst.title"></h2>
          <p class="ch-intro rise" style="--d:260" data-t="chapterConst.intro"></p>
          <p class="counter rise" style="--d:400" id="constCount" aria-live="polite" hidden></p>
        </div>

        <div class="const-stage rise" style="--d:500" id="constStage" role="group" data-t-attr="aria-label:chapterConst.groupLabel">
          <svg class="const-lines" id="constLines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg>
          <div class="const-stars" id="constStars"></div>
          <div class="const-empty" id="constEmpty" hidden>
            <svg class="ico const-empty__star" aria-hidden="true"><use href="#i-star"/></svg>
            <p class="const-empty__text" data-t="chapterConst.emptyText"></p>
            <button class="btn btn--primary" id="btnConstFirst" type="button" data-goto="wish">
              <span data-t="chapterConst.emptyButton"></span>
              <svg class="ico ico--sm"><use href="#i-star"/></svg>
            </button>
          </div>
        </div>

        <div class="const-bottom">
          <button class="btn btn--primary js-next rise" style="--d:700" id="nextConst" type="button">
            <span data-t="chapterConst.next"></span>
            <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ SISIPAN — WISH IN A BOTTLE ============ -->
    <section class="chapter chapter--bottle" id="chBottle" data-key="bottle" data-interlude tabindex="-1" aria-labelledby="tBottle">
      <div class="bottle-wrap" id="bottleMain">
        <div class="sky-top">
          <p class="eyebrow rise" style="--d:0" data-t="chapterBottle.label"></p>
          <h2 class="ch-title rise" style="--d:120" id="tBottle" data-t="chapterBottle.title"></h2>
          <p class="ch-intro rise" style="--d:260" data-t="chapterBottle.intro"></p>
          <p class="counter rise" style="--d:400" id="bottleCount" aria-live="polite" hidden></p>
        </div>

        <div class="bottle-stage rise" style="--d:500" id="bottleStage">
          <div class="bottle-sea" aria-hidden="true"></div>
          <button class="bottle" id="bottleBtn" type="button" data-t-attr="aria-label:chapterBottle.bottleLabel">
            <span class="bottle__float">
              <svg class="bottle__svg" viewBox="0 0 200 320" aria-hidden="true" focusable="false">
                <defs>
                  <clipPath id="bClip"><path id="bShape" d="M86 38h28v44c0 14 6 22 22 36 16 14 24 30 24 52v96c0 22-14 34-34 34H74c-20 0-34-12-34-34v-96c0-22 8-38 24-52 16-14 22-22 22-36z"/></clipPath>
                  <radialGradient id="bGlow" cx="50%" cy="62%" r="55%">
                    <stop offset="0" stop-color="#FFE9D6" stop-opacity=".95"/>
                    <stop offset=".45" stop-color="#E9CBC3" stop-opacity=".38"/>
                    <stop offset="1" stop-color="#C98F91" stop-opacity="0"/>
                  </radialGradient>
                  <linearGradient id="bGlass" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#F8F0EB" stop-opacity=".22"/>
                    <stop offset=".5" stop-color="#E9CBC3" stop-opacity=".07"/>
                    <stop offset="1" stop-color="#F8F0EB" stop-opacity=".16"/>
                  </linearGradient>
                </defs>
                <g clip-path="url(#bClip)">
                  <rect x="30" y="30" width="140" height="280" fill="url(#bGlass)"/>
                  <ellipse class="b-glow" cx="100" cy="212" rx="62" ry="78" fill="url(#bGlow)"/>
                  <g class="b-scroll">
                    <rect x="80" y="160" width="40" height="84" rx="9" fill="#F8F0EB"/>
                    <rect x="80" y="160" width="40" height="84" rx="9" fill="none" stroke="#C98F91" stroke-opacity=".5"/>
                    <path d="M88 176h24M88 188h24M88 200h16" stroke="#987D78" stroke-width="2" stroke-linecap="round" opacity=".55"/>
                    <rect x="78" y="212" width="44" height="7" rx="3" fill="#C98F91"/>
                  </g>
                  <path d="M52 176v82" stroke="#fff" stroke-opacity=".38" stroke-width="5" stroke-linecap="round" fill="none"/>
                  <path d="M52 276q2 8 10 12" stroke="#fff" stroke-opacity=".22" stroke-width="4" stroke-linecap="round" fill="none"/>
                </g>
                <path d="M92 52v30" stroke="#fff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path d="M86 38h28v44c0 14 6 22 22 36 16 14 24 30 24 52v96c0 22-14 34-34 34H74c-20 0-34-12-34-34v-96c0-22 8-38 24-52 16-14 22-22 22-36z" fill="none" stroke="#E9CBC3" stroke-opacity=".6" stroke-width="2.2" stroke-linejoin="round"/>
                <g class="b-cork">
                  <rect x="82" y="16" width="36" height="28" rx="6" fill="#987D78"/>
                  <path d="M88 24h24M88 32h24" stroke="#604A49" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
                </g>
              </svg>
              <span class="bottle__dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
            </span>
          </button>

          <div class="bottle-empty" id="bottleEmpty" hidden>
            <p class="bottle-empty__text" data-t="chapterBottle.emptyText"></p>
            <button class="btn btn--primary" id="btnBottleWrite" type="button" data-goto="wish">
              <span data-t="chapterBottle.emptyButton"></span>
              <svg class="ico ico--sm"><use href="#i-star"/></svg>
            </button>
          </div>
        </div>
        <p class="bottle-hint rise" style="--d:650" id="bottleHint" data-t="chapterBottle.hint"></p>

        <div class="const-bottom">
          <button class="btn btn--primary js-next rise" style="--d:800" id="nextBottle" type="button">
            <span data-t="chapterBottle.next"></span>
            <svg class="ico ico--sm"><use href="#i-arrow"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ CHAPTER 05 — THE FINAL REVEAL ============ -->
    <section class="chapter" id="ch5" data-key="reveal" tabindex="-1" aria-labelledby="t5">
      <div class="wrap wrap--center">
        <p class="eyebrow rise" style="--d:0" data-t="chapter5.label"></p>
        <h2 class="final__prompt rise" style="--d:150" id="t5" data-t="chapter5.prompt"></h2>

        <div class="env-stage rise" style="--d:600">
          <div class="env-glow" aria-hidden="true"></div>
          <button class="envelope" id="envelope" type="button" aria-label="Open the envelope">
            <span class="env-back"></span>
            <span class="env-letter" aria-hidden="true">
              <span class="env-to" id="envTo"></span>
              <i></i><i></i><i class="short"></i>
            </span>
            <span class="env-front"></span>
            <span class="env-flap"></span>
            <span class="env-seal" aria-hidden="true"><span class="seal-moon"></span></span>
          </button>
        </div>

        <p class="env-hint rise" style="--d:1000" id="envHint" data-t="chapter5.hint"></p>
      </div>
    </section>

    <!-- Panel detail wish (Constellation of Wishes) -->
    <div class="cpanel-wrap" id="cPanelWrap" aria-hidden="true" inert>
      <div class="cpanel" id="cPanel" role="dialog" aria-modal="true" aria-labelledby="cpTitle" aria-describedby="cpText" tabindex="-1">
        <button class="iconbtn cpanel__close" id="cpClose" type="button" data-t-attr="aria-label:chapterConst.closeLabel">
          <svg class="ico"><use href="#i-close"/></svg>
        </button>
        <svg class="ico cpanel__star" aria-hidden="true"><use href="#i-star"/></svg>
        <h2 class="cpanel__title" id="cpTitle" data-t="chapterConst.panelTitle"></h2>
        <p class="cpanel__text" id="cpText"></p>
        <p class="cpanel__date" id="cpDate"></p>
      </div>
    </div>

    <!-- Panel surat (Wish in a Bottle) -->
    <div class="bpanel-wrap" id="bPanelWrap" aria-hidden="true" inert>
      <div class="bpanel" id="bPanel" role="dialog" aria-modal="true" aria-labelledby="bpTitle" aria-describedby="bpText" tabindex="-1">
        <button class="iconbtn bpanel__close" id="bpClose" type="button" data-t-attr="aria-label:chapterBottle.closeLabel">
          <svg class="ico"><use href="#i-close"/></svg>
        </button>
        <p class="bpanel__eyebrow" id="bpTitle" data-t="chapterBottle.panelTitle"></p>
        <div class="bpanel__body" id="bpBody">
          <p class="bpanel__text" id="bpText"></p>
          <p class="bpanel__date" id="bpDate"></p>
        </div>
        <div class="bpanel__nav" id="bpNav">
          <button class="iconbtn bpanel__step" id="bpPrev" type="button" data-t-attr="aria-label:chapterBottle.prevLabel"><svg class="ico"><use href="#i-back"/></svg></button>
          <span class="bpanel__pos" id="bpPos" aria-live="polite"></span>
          <button class="iconbtn bpanel__step" id="bpNext" type="button" data-t-attr="aria-label:chapterBottle.nextLabel"><svg class="ico bpanel__fwd"><use href="#i-back"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Pengungkapan akhir (di atas chapter 5) -->
    <div class="reveal" id="reveal" aria-hidden="true" role="region" aria-labelledby="rvLine" tabindex="-1">
      <div class="reveal__dust" id="revealDust" aria-hidden="true"></div>
      <div class="reveal__inner">
        <div class="moon moon--dark r r0" aria-hidden="true"></div>
        <h2 class="r r1" id="rvLine" data-t="chapter5.revealLine"></h2>
        <p class="r r2" id="senderName"></p>
        <div class="r r3 reveal__closing" id="rvClosing"></div>
        <p class="r r3 reveal__date" id="rvDate"></p>
        <div class="r r4 actions actions--row">
          <button class="btn btn--primary" id="btnReplay" type="button"><span data-t="chapter5.replayButton"></span></button>
          <button class="btn btn--ghost" id="btnStars" type="button"><span data-t="chapter5.backButton"></span></button>
        </div>
      </div>
    </div>

  </main>

  <!-- Urutan penting: config dulu -->
  <script src="config.js"></script>
  <script src="js/music.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/wishes.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/bottle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
